<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowerSleep — Dev smart home</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e17;
      --surface: #111827;
      --surface-2: #1a2236;
      --accent: #38bdf8;
      --accent-dim: #1e3a5f;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --danger: #f87171;
      --success: #4ade80;
      --radius: 12px;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--accent-dim);
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--accent);
      text-transform: uppercase;
    }
    a.logo { text-decoration: none; color: inherit; }
    .nav-links { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: .45rem .9rem;
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--text);
      font-size: .8rem;
      cursor: pointer;
      text-decoration: none;
      transition: border .2s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent-dim); border-color: var(--accent); }
    main { max-width: 560px; margin: 0 auto; padding: 1.25rem; width: 100%; flex: 1; }
    h1 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--text-dim); font-weight: 600; }
    .card {
      background: var(--surface-2);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .card h2 {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--accent);
      margin-bottom: .65rem;
    }
    label { display: block; font-size: .75rem; color: var(--text-dim); margin-bottom: .35rem; }
    input[type="password"], textarea {
      width: 100%;
      padding: .55rem .75rem;
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: .9rem;
      margin-bottom: .75rem;
    }
    textarea { min-height: 120px; resize: vertical; font-family: inherit; }
    .device-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .5rem 0;
      border-bottom: 1px solid var(--accent-dim);
      font-size: .9rem;
    }
    .device-row:last-child { border-bottom: none; }
    .hint { font-size: .75rem; color: var(--text-dim); margin-top: .5rem; line-height: 1.4; }
    .status { font-size: .8rem; margin-top: .75rem; min-height: 1.2em; }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--success); }
    .rev { font-size: .7rem; color: var(--text-dim); margin-top: .5rem; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./index.html">PowerSleep</a>
    <nav class="nav-links">
      <a class="btn" href="./jarvis.html">Jarvis</a>
    </nav>
  </header>
  <main>
    <h1>Dev — smart home seed</h1>
    <p class="hint" style="margin-bottom:1rem">Internal page (not linked in the app). Devices: blinds and ambient lights only. Use <code style="color:var(--accent)">ADMIN_SECRET</code> from <code style="color:var(--accent)">.env</code>; in local dev the default is <code style="color:var(--accent)">dev-demo-secret</code> if unset. In production, set <code style="color:var(--accent)">ENABLE_ADMIN_UI=true</code> to serve this file.</p>

    <div class="card">
      <h2>Admin key</h2>
      <label for="adminKey">Bearer token (stored in session for this tab)</label>
      <input type="password" id="adminKey" placeholder="dev-demo-secret" autocomplete="off" />
    </div>

    <div class="card">
      <h2>Smart home (demo)</h2>
      <div id="devicesRoot"></div>
    </div>

    <button type="button" class="btn primary" id="saveBtn">Save changes</button>
    <div class="status" id="status"></div>
    <div class="rev" id="revLine"></div>
  </main>
  <script>
    const KEY_STORAGE = 'powersleep_admin_key';

    function setStatus(msg, kind) {
      const el = document.getElementById('status');
      el.textContent = msg || '';
      el.className = 'status' + (kind ? ' ' + kind : '');
    }

    function renderDevices(devices) {
      const root = document.getElementById('devicesRoot');
      if (!devices || !devices.length) {
        root.innerHTML = '<p class="hint">No devices</p>';
        return;
      }
      root.innerHTML = devices.map((d) => `
        <div class="device-row" data-id="${escapeHtml(d.id)}">
          <span>${escapeHtml(d.name)}</span>
          <label><input type="checkbox" class="dev-on" ${d.on ? 'checked' : ''} /> On</label>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function collectDevices() {
      const rows = document.querySelectorAll('.device-row');
      const out = [];
      rows.forEach((row) => {
        const cb = row.querySelector('.dev-on');
        const nameEl = row.querySelector('span');
        const id = row.dataset.id || 'device';
        const name = nameEl ? nameEl.textContent : 'Device';
        out.push({ id, name, on: cb ? cb.checked : false });
      });
      return out;
    }

    async function loadState() {
      setStatus('Loading…');
      try {
        const r = await fetch('./api/state');
        if (!r.ok) throw new Error('GET failed');
        const data = await r.json();
        renderDevices(data.smartHome?.devices || []);
        document.getElementById('revLine').textContent = 'revision ' + data.revision + ' · ' + (data.updatedAt || '');
        setStatus('', '');
      } catch (e) {
        setStatus('Could not load state. Is the app server running?', 'err');
      }
    }

    async function save() {
      const token = document.getElementById('adminKey').value.trim();
      if (!token) {
        setStatus('Enter the admin key.', 'err');
        return;
      }
      sessionStorage.setItem(KEY_STORAGE, token);
      setStatus('Saving…');
      try {
        const body = {
          smartHome: { devices: collectDevices() },
        };
        const r = await fetch('./api/state', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token,
          },
          body: JSON.stringify(body),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          throw new Error(data.error || r.statusText);
        }
        setStatus('Saved.', 'ok');
        document.getElementById('revLine').textContent = 'revision ' + data.revision + ' · ' + (data.updatedAt || '');
      } catch (e) {
        setStatus(String(e.message || e), 'err');
      }
    }

    document.getElementById('saveBtn').addEventListener('click', save);

    const saved = sessionStorage.getItem(KEY_STORAGE);
    if (saved) document.getElementById('adminKey').value = saved;

    loadState();
  </script>
</body>
</html>
